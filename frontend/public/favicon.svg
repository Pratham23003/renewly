<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="16" fill="#090D16"/>
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#iconGlow)">
    <!-- Continuous Renewal Loop Arrows -->
    <path d="M 32 14 A 18 18 0 0 1 49 28" fill="none" stroke="url(#blueGradient)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 44 22 L 50 29 L 41 33" fill="none" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M 32 50 A 18 18 0 0 1 15 36" fill="none" stroke="url(#blueGradient)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 20 42 L 14 35 L 23 31" fill="none" stroke="url(#blueGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
